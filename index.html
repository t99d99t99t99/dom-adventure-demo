<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090d12">
    <title>Snake · Arcade</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="barrier" aria-hidden="true"></canvas>
    <main class="title-card">
        <h1>S N A K E</h1>

        <div class="title-messages">
            <section class="message-group" aria-label="게임 안내">
                <p class="message-copy">방향키 또는 WASD로 스네이크를 조작하세요.</p>
                <p class="message-copy">최대한 많은 먹이를 모으세요!</p>
            </section>

            <section class="message-group system-note" aria-label="실행 환경 안내">
                <span>주의</span>
                <p class="message-copy">데스크톱 Chrome 환경에서 플레이하는 것을 권장합니다.</p>
                <p class="message-copy">모바일 기기에서는 조작이 불편할 수 있습니다.</p>
            </section>
        </div>

        <a class="play-link" href="./snake.html">게임 시작</a>
    </main>
</body>
</html>
